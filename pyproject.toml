[project]
name = "space-invaders"
version = "2.0.0"
description = "Space Invaders game implemented in Python using the Turtle graphics library"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "black>=24.0.0",
    "ruff>=0.16.0"
]

[project.scripts]
run = "app.main:main"

[tool.black]
line-length = 88
target-version = ['py314']
include = '\.pyi?$'

[tool.ruff]
# Set the maximum line length
line-length = 88

# Where to look for code
src = ["src"]

[tool.ruff.lint]
# Specify which rules to enable
# "E" and "F" are Flake8 rules, "I" is isort (imports)
select = ["E", "F", "I", "UP", "N"]

# Specify which rules to ignore
ignore = ["E501"]

[tool.ruff.lint.isort]
# Configuration for import sorting
combine-as-imports = true

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["assets/*", "assets/piskel/*"]

